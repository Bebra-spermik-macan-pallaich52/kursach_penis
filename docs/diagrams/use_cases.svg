<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1180" viewBox="0 0 1300 1180"><rect width="1300" height="1180" fill="white"/><g font-family="DejaVu Sans" font-size="18" fill="#111" stroke="#111" stroke-width="2"><rect x="220" y="30" width="850" height="1110" fill="none"/><text x="645" y="65" text-anchor="middle" stroke="none">REST-сервис учёта олимпиад</text><circle cx="100" cy="190" r="18" fill="white"/><path d="M100,208 v65 m-35,-45 h70 m-35,45 l-30,48 m30,-48 l30,48" fill="none"/><text x="100" y="340" text-anchor="middle" stroke="none">Гость</text><circle cx="100" cy="700" r="18" fill="white"/><path d="M100,718 v65 m-35,-45 h70 m-35,45 l-30,48 m30,-48 l30,48" fill="none"/><text x="100" y="850" text-anchor="middle" stroke="none">Студент</text><circle cx="1195" cy="190" r="18" fill="white"/><path d="M1195,208 v65 m-35,-45 h70 m-35,45 l-30,48 m30,-48 l30,48" fill="none"/><text x="1195" y="340" text-anchor="middle" stroke="none">Преподаватель</text><circle cx="1195" cy="780" r="18" fill="white"/><path d="M1195,798 v65 m-35,-45 h70 m-35,45 l-30,48 m30,-48 l30,48" fill="none"/><text x="1195" y="930" text-anchor="middle" stroke="none">Администратор</text><ellipse cx="435" cy="140" rx="170" ry="38" fill="#f6f8fc"/><text x="435" y="146" text-anchor="middle" stroke="none">Просматривать олимпиады</text><ellipse cx="435" cy="250" rx="170" ry="38" fill="#f6f8fc"/><text x="435" y="256" text-anchor="middle" stroke="none">Фильтровать по году</text><ellipse cx="435" cy="360" rx="170" ry="38" fill="#f6f8fc"/><text x="435" y="366" text-anchor="middle" stroke="none">Читать протокол и файлы</text><ellipse cx="435" cy="590" rx="170" ry="38" fill="#f6f8fc"/><text x="435" y="596" text-anchor="middle" stroke="none">Входить в систему</text><ellipse cx="435" cy="700" rx="170" ry="38" fill="#f6f8fc"/><text x="435" y="706" text-anchor="middle" stroke="none">Редактировать профиль</text><ellipse cx="435" cy="810" rx="170" ry="38" fill="#f6f8fc"/><text x="435" y="816" text-anchor="middle" stroke="none">Подавать заявки</text><ellipse cx="435" cy="920" rx="170" ry="38" fill="#f6f8fc"/><text x="435" y="926" text-anchor="middle" stroke="none">Смотреть свои результаты</text><ellipse cx="850" cy="140" rx="170" ry="38" fill="#f6f8fc"/><text x="850" y="146" text-anchor="middle" stroke="none">Создавать студентов</text><ellipse cx="850" cy="250" rx="170" ry="38" fill="#f6f8fc"/><text x="850" y="256" text-anchor="middle" stroke="none">Вести файлы и бланки</text><ellipse cx="850" cy="360" rx="170" ry="38" fill="#f6f8fc"/><text x="850" y="366" text-anchor="middle" stroke="none">Вводить результаты</text><ellipse cx="850" cy="470" rx="170" ry="38" fill="#f6f8fc"/><text x="850" y="476" text-anchor="middle" stroke="none">Готовить / отзывать</text><ellipse cx="850" cy="680" rx="170" ry="38" fill="#f6f8fc"/><text x="850" y="686" text-anchor="middle" stroke="none">Вести учётные записи</text><ellipse cx="850" cy="790" rx="170" ry="38" fill="#f6f8fc"/><text x="850" y="796" text-anchor="middle" stroke="none">Вести карточки олимпиад</text><ellipse cx="850" cy="900" rx="170" ry="38" fill="#f6f8fc"/><text x="850" y="906" text-anchor="middle" stroke="none">Публиковать протокол</text><ellipse cx="850" cy="1010" rx="170" ry="38" fill="#f6f8fc"/><text x="850" y="1016" text-anchor="middle" stroke="none">Выгружать отчёты</text><path d="M135,235 L265,140" fill="none"/><path d="M135,235 L265,250" fill="none"/><path d="M135,235 L265,360" fill="none"/><path d="M135,745 L265,590" fill="none"/><path d="M135,745 L265,700" fill="none"/><path d="M135,745 L265,810" fill="none"/><path d="M135,745 L265,920" fill="none"/><path d="M1160,235 L1020,140" fill="none"/><path d="M1160,235 L1020,250" fill="none"/><path d="M1160,235 L1020,360" fill="none"/><path d="M1160,235 L1020,470" fill="none"/><path d="M1160,235 L1020,1010" fill="none"/><path d="M1160,825 L1020,680" fill="none"/><path d="M1160,825 L1020,790" fill="none"/><path d="M1160,825 L1020,900" fill="none"/><path d="M1160,825 L1020,10