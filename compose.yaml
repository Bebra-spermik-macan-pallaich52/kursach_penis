services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: olympiads
      POSTGRES_USER: olympiad
      POSTGRES_PASSWORD: olympiad_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olympiad -d olympiads"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:

